<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentStack · 任务观察台</title>
<style>
:root{font:15px/1.65 system-ui,sans-serif;color:#172c38;background:#f2f5f4}body{margin:0}header{background:#123b38;color:white;padding:24px 5vw}h1{font-size:25px;margin:0}header p{margin:6px 0;color:#bdd6ce}.health{font-size:13px}main{padding:24px 5vw;display:grid;gap:22px;grid-template-columns:minmax(260px,1fr) minmax(360px,2fr)}section{background:white;border:1px solid #dce5e1;border-radius:12px;padding:20px}h2{font-size:17px;margin:0 0 15px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.8 ui-monospace,monospace}button{display:block;width:100%;text-align:left;border:1px solid #dce5e1;border-radius:8px;background:white;padding:12px;margin:9px 0;cursor:pointer;color:inherit}button:hover,button[aria-pressed=true]{background:#e7f2ed;border-color:#368b72}small{display:block;color:#60746c}.summary{grid-column:1/-1}.muted{color:#64796f}select{padding:7px;border:1px solid #bbcfc6;border-radius:5px}footer{padding:0 5vw 25px;color:#64796f;font-size:13px}@media(max-width:760px){main{display:block}section{margin-bottom:16px}}
</style>
<header><h1>AgentStack · 任务观察台</h1><p>查看执行进度，不唤醒 Agent，不增加 MM 消息。</p><div id="health" class="health" role="status">正在读取本机记录…</div></header>
<main><section class="summary"><h2>调度与连接</h2><pre id="summary"></pre></section>
<section><h2>任务 <select id="filter" aria-label="筛选任务"><option value="active">进行中与待处理</option><option value="all">全部（最近100项）</option></select></h2><div id="tasks"></div></section>
<section><h2>角色与最近活动</h2><p class="muted">选择任务，查看各角色、会话、最近工具及等待问题。</p><pre id="detail">尚未选择任务。</pre><h2>结果与证据位置</h2><pre id="result">尚无结果。</pre></section></main>
<footer>只读 · 每 3 秒刷新 · 进程退出不等于任务完成 · 文件条件通过不等于业务测试通过。Router 心跳失联时显示最后记录。</footer>
<script>
let selected='',busy=false;const states={queued:'排队',running:'执行中',waiting_input:'等待你的回答',succeeded:'所列文件条件通过',reported_unverified:'执行已返回 · 未核验',failed:'失败',interrupted:'已中断',timed_out:'超时'};
async function refresh(){if(busy||document.hidden)return;busy=true;try{const response=await fetch('/api/status'+(selected?'?task='+encodeURIComponent(selected):''));if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();document.getElementById('summary').textContent=data.summary;document.getElementById('health').textContent='监控连接正常 · 最近读取 '+new Date().toLocaleTimeString();const list=document.getElementById('tasks');list.replaceChildren();for(const t of data.tasks){if(document.getElementById('filter').value==='active'&&['succeeded','reported_unverified'].includes(t.status))continue;const b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed',String(selected===t.id));b.textContent=t.project_id+' · '+(states[t.status]||t.status);const sub=document.createElement('small');sub.textContent=t.id;b.append(sub);b.onclick=()=>{selected=t.id;refresh()};list.append(b)}if(!list.childElementCount)list.textContent='没有符合筛选条件的任务。';if(data.detail)document.getElementById('detail').textContent=data.detail;if(data.result)document.getElementById('result').textContent=(data.result.summary||'尚无完成报告')+'\n\n本机证据位置：'+JSON.stringify(data.result.evidence)}catch(e){document.getElementById('health').textContent='监控读取失败；下方保留旧数据，不代表当前状态。'}finally{busy=false}}
document.getElementById('filter').onchange=refresh;refresh();setInterval(refresh,3000);
</script></html>
