main{max-width:1900px}.workspace{grid-template-columns:1fr}#teams{grid-template-columns:repeat(2,minmax(0,1fr))}.team{padding:24px}.orbit{height:255px;max-width:400px}.orbit:before{width:190px;height:190px}.pos-0{left:50%;top:9%}.pos-1{left:14%;top:78%}.pos-2{left:86%;top:78%}.hub{width:116px;height:116px;top:54%}.hub.running{border-color:var(--mint);box-shadow:0 0 25px #66e3ba30}.hub.finished{border-color:#8fc5b5}.hub b{font-size:17px}.hub small{font-size:10px}.focus{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;min-height:160px}.focus>h3,.focus>.sub,.focus>.banner,.focus>.empty,.focus>#report{grid-column:1/-1}.focus>.worker{min-width:0;margin:0;align-self:start}.workerhead{flex-wrap:wrap}.issues-panel{margin-bottom:20px}#issues{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px}.issue{text-align:left;color:var(--muted);border:1px solid #59462d;border-radius:8px;background:#1e1c19;padding:14px;display:grid;gap:5px;font-size:12px}.issue b{color:var(--amber);font-size:14px}.issue:hover{border-color:var(--amber)}.node.resume_pending .circle{color:var(--amber);border-color:var(--amber)}

<aside><div><div class="brand"><span class="logo">◈</span>AgentStack</div><div class="sub">团队编排与执行监控</div></div><nav><a href="#overview"><span>▦</span>总览</a><a href="#team-section"><span>◇</span>团队</a><a href="#history"><span>◷</span>任务历史</a></nav><div class="local"><span class="accent">●</span>本地观察模式<div class="sub">只读 · 不唤醒 Agent</div></div></aside>
<main id="overview"><header><div><h1>团队控制台</h1><p class="muted">所有团队，一处掌握。</p></div><button class="btn" id="refresh">↻ 刷新</button></header><div id="banner" class="banner" role="status">正在连接本机监控…</div>

<section class="panel history" id="history"><div class="panelhead"><h2><span class="accent">≡</span>最近任务</h2><div class="controls"><input id="search" placeholder="搜索项目 / 任务 ID" aria-label="搜索任务"><select id="filter" aria-label="筛选任务"><option value="all">全部记录</option><option value="active">执行中 / 等待</option><option value="attention">待处理</option><option value="done">验收通过</option></select></div></div><div class="tablewrap"><table><thead><tr><th>项目 / 任务</th><th>状态</th><th>创建时间</th></tr></thead><tbody id="tasks"></tbody></table></div></section>

<script>
const $=id=>document.getElementById(id);let selected='',data=null,busy=false,query=0;const expandedWorkers=new Set();const roles=['developer','reviewer','tester','lead-report'],names=['开发','评审','测试','Leader'],short=['DEV','REVIEW','TEST','LEAD'];const states={queued:'排队中',running:'执行中',waiting_input:'等待回答',succeeded:'验收通过',reported_unverified:'待核验',failed:'失败',timed_out:'超时',interrupted:'已中断'};
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}function badge(t){if(t.resume_pending)return el('span','badge warn',t.queue_blockers?.length?'待续跑 · 有阻塞':'待续跑 · 等待调度');return el('span','badge '+(t.status==='succeeded'?'good':['failed','timed_out','waiting_input'].includes(t.status)&&!t.resolved?'warn':''),(states[t.status]||t.status)+(t.resolved?' · 已处理':''))}function pick(id){selected=id;render();loadDetail(id)}function time(s){if(!s)return '—';const d=new Date(s.replace(' ','T')+(/[Zz]$|[+-]\d\d:\d\d$/.test(s)?'':'Z'));return isNaN(d)?s:d.toLocaleString('zh-CN',{hour12:false})}
function render(){if(!data)return;const m=data.metrics||{},h=data.health||{};[['total','teams'],['active','active_teams'],['running','running_workers'],['attention','attention']].forEach(([id,k])=>$(id).textContent=m[k]??'—');$('banner').className='banner'+(h.router==='online'?' ok':'');$('banner').textContent=h.router==='online'?'● Router 心跳正常 · 团队与 Worker 状态持续更新':h.router==='stopped'?'△ Router 已停止 · 当前展示最后记录，活跃数量无法确认':'△ Router 心跳失联 · 当前展示最后记录，无法确认团队与 Worker 是否仍在运行';$('router-health').textContent={online:'在线',stopped:'已停止',stale:'状态待确认'}[h.router]||'无记录';for(const [id,k] of [['mm-health','mm'],['mc-health','multica']])$(id).textContent=h[k]==='connected'?(h.router==='online'?'已连接':'上次已连接'):h[k]?.includes('error')?'上次连接异常':'未配置';$('teams').replaceChildren();for(const team of data.teams||[]){const t=team.task,b=el('button','team'+(selected===t?.id?' selected':''));b.type='button';b.disabled=!t;const title=el('div');title.append(el('h3','',team.id));title.append(el('p','sub',t?'最近任务 · '+t.id.slice(0,8):'尚无任务'));if(t)title.append(badge(t));if(team.paused)title.append(el('span','badge warn','项目暂停'));const pipe=el('div','orbit');const hub=el('div','hub');const leader=team.workers.find(w=>w.role==='lead-report');hub.classList.add(leader?.state||'not_started');hub.append(el('span','hub-icon','◈'),el('b','','Leader'),el('small','',phaseName(leader?.phase)),el('small','',workerState(leader?.state||'not_started')));pipe.append(hub);roles.slice(0,3).forEach((role,i)=>{const w=team.workers.find(w=>w.role===role),n=el('div','node pos-'+i+' '+(w?.state||''));n.append(el('span','circle',w?.state==='finished'?'✓':w?.state==='running'?'●':['unknown','blocked','awaiting_user'].includes(w?.state)?'!':['⌘','◇','⌕','≡'][i]),el('div','',names[i]),el('small','',workerState(w?.state||'not_started')));pipe.append(n)});b.append(title,pipe);const route=el('div','journey');route.append(el('span','muted','实际交接  '));for(const j of (team.journey||[]).slice(-10)){const hop=el('span','hop',(j.role==='lead-report'?phaseName(j.phase):names[roles.indexOf(j.role)]||j.role)+(j.round?' · 返工 '+j.round:''));hop.title=time(j.time);route.append(hop)}if(!(team.journey||[]).length)route.append(el('span','muted','尚未启动角色'));b.append(route);b.onclick=()=>pick(t.id);$('teams').append(b)}if(!(data.teams||[]).length)$('teams').append(el('div','empty','尚未登记团队'));
const body=$('tasks');body.replaceChildren();const search=$('search').value.toLowerCase(),filter=$('filter').value;let count=0;for(const t of data.tasks||[]){if(!(t.project_id+' '+t.id).toLowerCase().includes(search))continue;if(filter==='active'&&!['running','queued','waiting_input'].includes(t.status))continue;if(filter==='done'&&t.status!=='succeeded')continue;if(filter==='attention'&&!(t.queue_blockers?.length||t.status==='waiting_input'||(['failed','timed_out','interrupted'].includes(t.status)&&!t.resolved)))continue;count++;const row=el('tr'),project=el('td'),button=el('button','',t.project_id);button.onclick=()=>pick(t.id);button.append(el('small','',t.id.slice(0,12)));project.append(button);const status=el('td');status.append(badge(t));row.append(project,status,el('td','muted',time(t.created_at)));body.append(row)}if(!count){const row=el('tr'),cell=el('td','muted','没有符合条件的任务');cell.colSpan=3;row.append(cell);body.append(row)}renderIssues();renderFocus()}
function renderFocus(){const f=$('focus');f.replaceChildren();if(!selected){const empty=el('div','empty');empty.append(el('div','cube','◇'),el('b','','等待选择任务'),el('p','','选择团队或任务，查看角色与执行结果。'));f.append(empty);return}const task=data.tasks.find(t=>t.id===selected);f.append(el('h3','',task?.project_id||'任务详情'),el('p','sub',selected));if(task?.resume_pending){const pending=el('div','banner');pending.append(el('b','','答案已保存 · 待续跑'),el('p','',task.queue_blockers.length?task.queue_blockers.map(k=>issueTypes[k][0]).join('；'):'等待调度器分配执行槽位。'));f.append(pending)}if(task?.status==='waiting_input'){const ask=el('div','banner');ask.append(el('b','','需要你的选择'),el('p','',task.question||'正在读取问题…'),el('small','','在原 MM 线程回复，或把答案告诉当前助手：'),el('pre','','/router answer '+task.id+' '+(task.question_id||'')+' 你的答案'));f.append(ask)}const observed=(data.workers||[]).filter(w=>w.task_id===selected);for(const w of roles.map(role=>observed.find(w=>w.role===role)||{role,state:'not_started',visits:0})){const card=el('details','worker '+w.state),head=el('summary','workerhead');card.open=expandedWorkers.has(w.role);card.ontoggle=()=>{if(card.open)expandedWorkers.add(w.role);else expandedWorkers.delete(w.role)};head.append(el('b','',names[roles.indexOf(w.role)]+' / '+short[roles.indexOf(w.role)]),el('span','badge',workerState(w.state)));card.append(head,el('small','','PID '+(w.pid??'未记录')+' · 参与 '+(w.visits||0)+' 次 · '+(w.tool?'最近工具 '+w.tool:'无工具活动记录')));if(w.agent_id)card.append(el('small','','Agent '+w.agent_id+' · '+w.profile_version+' · '+(w.profile_digest||'').slice(0,12)));if(w.session_id)card.append(el('small','','Session '+w.session_id));card.append(el('small','','最近输出：'+(w.output_age_seconds==null?'无记录':w.output_age_seconds+' 秒前')+' · '+({started:'工具执行中',returned:'工具已返回',error:'工具返回错误'}[w.tool_state]||'等待活动记录')));const timeline=el('div','activity');for(const a of (data.activity||[]).filter(a=>a.task_id===selected&&a.role===w.role).slice(-14).reverse()){const item=el('div','activity-item');item.append(el('span','activity-time',time(a.time)),el('span','',({role_started:'进入角色',role_finished:'角色已返回',started:'进程启动',finished:'进程已结束',role_verdict:'复核结论',leader_decision:'Leader 决策',leader_requested:'交给 Leader 分诊',tool_activity:'工具',role_retry_requested:'发起复核重试',rework_requested:'返回开发修复',answer_recorded:'收到回答',waiting_input:'等待回答'}[a.kind]||a.kind)+(a.phase?.startsWith('lead-')?' · '+phaseName(a.phase):'')+(a.tool?' · '+a.tool:'')+(a.state?' · '+({started:'开始',returned:'返回',error:'错误',PASS:'通过',BLOCKED:'需修复',waiting_input:'等待回答',awaiting_user:'等待回答',answered:'答案已记录',PLAN:'规划完成',REWORK:'安排返工',STOP:'停止并上报',succeeded:'已通过',reported_unverified:'阶段返回',failed:'失败'}[a.state]||a.state):'')));timeline.append(item)}if(!timeline.childElementCount)timeline.append(el('small','',w.role==='lead-report'?'Leader 负责开工规划、问题分诊和最终汇报；此任务尚无 Leader 执行记录。':'尚无活动事件'));card.append(timeline);f.append(card)}const details=el('details');details.append(el('summary','','查看报告与诊断'),el('pre','','正在读取…'));details.id='report';f.append(details)}

function phaseName(phase){return {'lead-plan':'Leader 规划','lead-triage':'Leader 分诊','lead-report':'Leader 汇报'}[phase]||'规划 · 分诊 · 汇报'}
function workerState(state){return {running:'执行中',finished:'已返回',unknown:'状态待确认',inactive:'本次进程已结束',blocked:'需处理',awaiting_user:'等待你回答',resume_pending:'答案已存 · 待续跑',not_started:'尚未参与'}[state]||state}
const issueTypes={
 router_offline:['Router 未运行','先诊断启动失败并恢复服务；答案已持久化，无需重复提交。'],
 scheduler_paused:['调度已暂停','确认暂停原因后，使用 /router resume 恢复调度。'],
 project_paused:['项目已暂停','先核对该项目失败证据，处理后显式恢复项目。'],
 project_busy:['等待同项目任务','该项目已有执行中或待回答任务；先处理前序任务。'],
 needs_answer:['需要你的决定','打开任务，阅读问题并在原线程回答；回答后继续原任务。'],
 checkpoint_changed:['续跑现场已变化','核对工作区改动与检查点；确认后重新规划，不能盲目续跑。'],
 permission_denied:['权限被拒绝','检查具体操作与权限范围；不自动重试或绕过拒绝。'],
 receipt_invalid:['交互回执异常','检查回执格式及原始证据；保留失败记录后修复协议。'],
 timeout:['执行超时','查看最后活动与进程状态，确定停止点和副作用后再处理。'],
 interrupted:['执行被中断','核对已产生的文件改动与报告，确认安全续接位置。'],
 execution_failed:['执行失败','查看角色报告和失败命令，修复根因后再安排验证。']
};
function renderIssues(){const box=$('issues');box.replaceChildren();for(const issue of data.issues||[]){const copy=issueTypes[issue.category]||['待诊断','打开任务查看记录。'],card=el('button','issue');card.type='button';card.append(el('span','sub',issue.project_id),el('b','',copy[0]),el('span','',copy[1]));card.onclick=()=>pick(issue.task_id);box.append(card)}if(!box.childElementCount)box.append(el('p','muted','当前没有待处理问题。'))}

async function loadDetail(id){const ticket=++query;try{const r=await fetch('/api/status?task='+encodeURIComponent(id));if(!r.ok)throw Error();const d=await r.json();if(selected!==id||ticket!==query)return;const pre=$('report')?.querySelector('pre');if(pre)pre.textContent=(d.result?.summary||'尚无完成报告')+'\n\n'+(d.detail||'')+'\n\n证据位置：'+JSON.stringify(d.result?.evidence??'未记录')}catch{const pre=$('report')?.querySelector('pre');if(pre)pre.textContent='详情读取失败，请重试。'}}
async function refresh(){if(busy)return;busy=true;try{const r=await fetch('/api/status',{signal:AbortSignal.timeout(5000)});if(!r.ok)throw Error();data=await r.json();const open=$('report')?.open;render();if(selected){if($('report'))$('report').open=!!open;loadDetail(selected)}$('connection').textContent='● 本机监控已连接';$('connection').style.color='var(--mint)';$('updated').textContent='更新于 '+new Date().toLocaleTimeString('zh-CN',{hour12:false})}catch{$('connection').textContent='● 监控连接中断';$('connection').style.color='var(--amber)';$('banner').className='banner';$('banner').textContent='△ 监控读取失败 · 下方是旧数据，不代表当前状态';$('active').textContent='—';$('running').textContent='—'}finally{busy=false}}
function refilter(){render();if(selected)loadDetail(selected)}$('search').oninput=refilter;$('filter').onchange=refilter;$('refresh').onclick=refresh;document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});refresh();setInterval(()=>{if(!document.hidden)refresh()},3000);
</script></html>
